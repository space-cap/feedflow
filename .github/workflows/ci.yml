name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./dev.db
      FEEDFLOW_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize database
        run: npm run db:init

      - name: Seed database
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > dev-server.log 2>&1 &
          npx --yes wait-on http://127.0.0.1:3000

      - name: Smoke test
        run: npm run test:api
